[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-former"
version = "0.3.0"
description = "SpectraFormer experiments for multivariate time-series imputation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.scripts]
spectra-former = "spectraformer.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["spectraformer*"]
